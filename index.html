<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>
    <body>
        <header class="header">
            <div class="header__left">
                <button class="header__hamburger">
                    <img src="/assets/icons/Menu.svg" alt="menu button" />
                </button>

                <a href="#" class="header__logo">
                    <img
                        class="header__logo-icon"
                        src="/assets/icons/Logo.svg"
                        alt="alurobooks logo"
                    />
                    <div class="header__logo-name">
                        <span class="header__logo-name--alura">Alura</span>
                        <span class="header__logo-name--books">Books</span>
                    </div>
                </a>
            </div>
            <nav class="header__nav">
                <ul class="header__menu">
                    <li class="header__item">
                        <button class="header__categories-button">
                            categories
                        </button>
                        <ul class="header__categories-submenu">
                            <li><a href="#">programming</a></li>
                            <li><a href="#">front-end</a></li>
                            <li><a href="#">infrastructure</a></li>
                            <li><a href="#">business</a></li>
                            <li><a href="#">design & ux</a></li>
                        </ul>
                    </li>

                    <li class="header__item">
                        <button>favorites</button>
                    </li>

                    <li class="header__item">
                        <button>my bookshelf</button>
                    </li>
                </ul>
            </nav>

            <ul class="header__action">
                <li class="header__action-item">
                    <a href="#"
                        ><img
                            src="/assets/icons/Favoritos_header.svg"
                            alt="wishlist"
                    /></a>
                </li>
                <li class="header__action-item">
                    <a href="#"
                        ><img src="/assets/icons/bag.svg" alt="cart" /><span
                            >my bag</span
                        ></a
                    >
                </li>
                <li class="header__action-item">
                    <a href="#"
                        ><img
                            src="/assets/icons/profile.svg"
                            alt="profile"
                        /><span>my profile</span></a
                    >
                </li>
            </ul>
        </header>
        <!-- <div>Hello World</div> -->

        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
